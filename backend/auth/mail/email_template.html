<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f5f8; margin: 0; padding: 28px 12px; color: #111827; }
        .container { width: 100%; max-width: 560px; margin: 0 auto; background-color: #ffffff; padding: 28px; border-radius: 14px; box-shadow: 0 8px 28px rgba(15,23,42,.08); }
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; padding-bottom: 18px; }
        .mark { width: 40px; height: 40px; border-radius: 10px; line-height: 40px; text-align: center; background: #1467ff; color: #fff; font-size: 22px; font-weight: 700; }
        .brand { font-size: 20px; font-weight: 700; color: #111827; }
        .content { text-align: center; }
        .content h1 { color: #111827; font-size: 24px; }
        .content p { color: #667085; line-height: 1.55; }
        .code { font-size: 28px; font-weight: bold; color: #1467ff; letter-spacing: 7px; margin: 18px 0; padding: 12px 18px; border: 1px dashed #84adff; border-radius: 10px; display: inline-block; background: #f5f9ff; }
        .footer { text-align: center; padding-top: 20px; font-size: 12px; color: #98a2b3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><span class="mark">N</span><span class="brand">Novera</span></div>
        <div class="content">
            <h1>Xác minh địa chỉ email của bạn</h1>
            <p>Cảm ơn bạn đã đăng ký với Novera. Vui lòng sử dụng mã sau để xác minh địa chỉ email của bạn:</p>
            <div class="code">{{CODE}}</div>
            <p>Mã này sẽ hết hạn sau 5 phút và chỉ sử dụng được một lần.</p>
        </div>
        <div class="footer"><p>&copy; 2026 Novera. All rights reserved.</p></div>
    </div>
</body>
</html>
